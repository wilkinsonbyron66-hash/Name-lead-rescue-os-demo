<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Rescue OS</title>
  <link href="https://rsms.me/inter/inter.css" rel="stylesheet">
  <style>
    :root { --accent: #8b7cff; --accent2: #5eead4; --bg: #0b0d12; --text: #f4f6fb; --muted: #9aa4b5; --line: #293141; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 80% 0, #27204f 0, #0b0d12 38%); color: var(--text); font: 15px/1.55 'Inter', system-ui; min-height: 100vh; }
    .wrap { max-width: 1120px; margin: auto; padding: 36px 22px 70px; }
    .hero { display: flex; justify-content: space-between; gap: 30px; align-items: flex-end; margin-bottom: 28px; }
    .eyebrow { color: var(--accent2); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    .hero h1 { font-size: 48px; line-height: 1; margin: 10px 0 12px; }
    .badge { border: 1px solid var(--line); background: #111521; padding: 10px 13px; border-radius: 999px; color: #cbd3e2; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .card { background: rgba(19, 23, 34, 0.88); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
    .card h2 { margin: 0 0 16px; font-size: 18px; }
    .full { grid-column: 1 / -1; }
    label { display: block; color: #cbd3e2; font-weight: 700; font-size: 13px; margin: 0 0 7px; }
    input, textarea, select { width: 100%; background: #0e121b; border: 1px solid #303849; color: var(--text); border-radius: 10px; padding: 12px; font: inherit; outline: none; margin-bottom: 14px; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 110px; resize: vertical; font-family: monospace; font-size: 13px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { border: 0; border-radius: 11px; padding: 12px 16px; font-weight: 800; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
    .primary { background: linear-gradient(135deg, var(--accent), #b19cff); color: white; width: 100%; }
    .secondary { background: #202635; color: #e8ecf5; border: 1px solid #343c4c; }
    .whatsapp { background: #25d366; color: white; }
    .email { background: #ea4335; color: white; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab { background: #171c28; color: #aeb7c8; border: 1px solid var(--line); padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .tab.active { background: #2a2550; color: #fff; border-color: #6d61cf; }
    .output { white-space: pre-wrap; background: #0d1119; border: 1px solid #2d3545; border-radius: 12px; padding: 16px; min-height: 240px; color: #e9edf7; font-family: monospace; font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpi { background: #10151f; border: 1px solid var(--line); padding: 13px; border-radius: 12px; }
    .kpi b { font-size: 22px; display: block; margin-top: 8px; }
    .small { color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } .actions { grid-template-columns: 1fr; } button { width: 100%; margin-right: 0; } }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div>
        <div class="eyebrow">Demo • Free to test</div>
        <h1>Lead Rescue OS</h1>
        <p>Instant sales replies + follow-up automation for service businesses.</p>
      </div>
      <div class="badge">v2.0 • Template Demo</div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Lead Details</h2>
        <div class="row">
          <div><label>Business</label><input id="biz" value="Dubai Auto Detailing"></div>
          <div><label>Offer</label><input id="offer" value="Ceramic Coating"></div>
        </div>
        <div class="row">
          <div><label>Lead Name</label><input id="name" value="James"></div>
          <div><label>Phone</label><input id="phone" placeholder="+971501234567"></div>
        </div>
        <div class="row">
          <div><label>Email</label><input id="email" placeholder="name@example.com"></div>
          <div><label>Price (AED)</label><input id="price" type="number" value="3500"></div>
        </div>
        <label>Lead Message</label>
        <textarea id="lead">How much for ceramic coating on a BMW M4?</textarea>
        <button class="primary" onclick="generate()">Generate Reply</button>
      </section>

      <section class="card">
        <h2>Revenue</h2>
        <div class="kpis">
          <div class="kpi"><span class="small">1 Sale</span><b id="kpi1">AED 3,500</b></div>
          <div class="kpi"><span class="small">10 Sales</span><b id="kpi2">AED 35,000</b></div>
          <div class="kpi"><span class="small">100 @ 25%</span><b id="kpi3">AED 87,500</b></div>
        </div>
      </section>

      <section class="card full">
        <div class="tabs">
          <button class="tab active" onclick="tab('reply')">Reply</button>
          <button class="tab" onclick="tab('follow')">Follow-up</button>
          <button class="tab" onclick="tab('qualify')">Qualify</button>
        </div>
        <div class="output" id="output">Click "Generate Reply" to get started</div>
        <div class="actions">
          <button class="secondary" onclick="copy()">📋 Copy</button>
          <button class="whatsapp" onclick="whatsapp()">📱 WhatsApp</button>
          <button class="email" onclick="email()">📧 Email</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    let current = 'reply';
    let responses = {};

    function tab(t) {
      current = t;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('output').textContent = responses[current] || 'Generate first';
    }

    function generate() {
      const name = document.getElementById('name').value;
      const offer = document.getElementById('offer').value;
      const price = parseInt(document.getElementById('price').value);
      const priceStr = 'AED ' + price.toLocaleString();

      responses.reply = `Hi ${name} — absolutely! For ${offer}, we start at around ${priceStr} depending on spec.

Quick questions:
1) What's your timeline?
2) Best value, premium, or maximum quality?

I'll send the exact price + turnaround time once I know.`;

      responses.follow = `DAY 0: Send the reply above.

DAY 1: "Quick one, ${name} — want me to send 2-3 examples?"

DAY 3: "Checking in, ${name}. Budget, timeline, or quality — what matters most?"

DAY 6: "Still interested? I have an opening next week. Want me to reserve it?"

DAY 12: "Closing this now, but reply 'YES' anytime and I'll pick it back up."`;

      responses.qualify = `SCORECARD (0-2 each)

Need/urgency: Specific problem? Has deadline?

Fit: Right customer? Any blockers?

Buying signal: Asked about price/timeline? Engaged?

Value: Worth ${priceStr}? Upsell opportunity?

Next: Ask 1 question, no brochure.

TOTAL: /10 → 7-10 hot | 4-6 nurture | 0-3 pass`;

      document.getElementById('output').textContent = responses.reply;
      document.getElementById('kpi1').textContent = priceStr;
      document.getElementById('kpi2').textContent = 'AED ' + (price * 10).toLocaleString();
      document.getElementById('kpi3').textContent = 'AED ' + Math.round(price * 25).toLocaleString();
    }

    function copy() {
      navigator.clipboard.writeText(document.getElementById('output').textContent);
      alert('Copied!');
    }

    function whatsapp() {
      const phone = document.getElementById('phone').value;
      if (!phone) { alert('Enter phone number'); return; }
      const msg = encodeURIComponent(document.getElementById('output').textContent);
      window.open('https://wa.me/' + phone.replace(/\D/g, '') + '?text=' + msg);
    }

    function email() {
      const email_addr = document.getElementById('email').value;
      if (!email_addr) { alert('Enter email'); return; }
      const subject = encodeURIComponent('Re: ' + document.getElementById('offer').value);
      const body = encodeURIComponent(document.getElementById('output').textContent);
      window.open('mailto:' + email_addr + '?subject=' + subject + '&body=' + body);
    }
  </script>
</body>
</html>
